<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        const theme = localStorage.getItem('learn-herdr-theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme;
          document.querySelector('meta[name="color-scheme"]').content = theme;
        }
      } catch {}
    </script>
    <meta name="description" content="中文 Herdr 交互练习场：窗格、标签页、工作区、会话持久化与智能体工作流。" />
    <title>Herdr 练习</title>
    <style>
      :root { color-scheme: light dark; background: #ffffff; color: #171918; }
      @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { background: #171918; color: #e9eeeb; } }
      :root[data-theme="dark"] { color-scheme: dark; background: #171918; color: #e9eeeb; }
      :root[data-theme="light"] { color-scheme: light; }
      .startup-shell { box-sizing: border-box; min-height: 100dvh; padding: 24px clamp(18px, 4vw, 56px); font-family: "SFMono-Regular", Consolas, "PingFang SC", monospace; }
      .startup-shell strong { font-size: 20px; font-weight: 400; }
      .startup-shell p { margin-top: 12px; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="app" aria-live="off">
      <div class="startup-shell" role="status" aria-label="正在加载">
        <strong>Herdr</strong>
        <p>正在加载…</p>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
